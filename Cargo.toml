[workspace]
resolver = "2"
members = ["crates/ea-plataforma", "crates/ea-ajustes", "crates/ea-biblioteca", "crates/ea-boveda", "crates/ea-acciones", "crates/ea-store", "crates/ea-bus", "crates/ea-cli", "crates/ea-mcp", "crates/ea-orchestrator", "crates/ea-web", "crates/ea-pruebas"]
exclude = ["escritorio", "instalador"]

[workspace.package]
edition = "2024"
# La versión mínima de Rust: `File::lock` (estable desde 1.89; los let-chains de
# la edición 2024, `rmcp` y `time` piden 1.88). Con una más vieja, cargo lo dice
# en vez de dar errores de sintaxis o de API inestable.
rust-version = "1.89"
publish = false

# Las versiones de las dependencias externas que comparten varios crates se
# fijan aquí una sola vez (`x.workspace = true`); cada crate pide sus propias
# features, que se suman. `escritorio/` e `instalador/` no son miembros y no
# heredan de aquí.
[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
directories = "5.0"
getrandom = "0.2"
rmcp = "3.3"
rusqlite = "0.32"
serde = "1.0"
serde_json = "1.0"
tempfile = "3"
thiserror = "1.0"
time = "0.3"
tokio = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
# Binarios más pequeños (un 15-20 % menos que solo con lto, con el mismo
# tiempo de compilación). Sin `panic = "abort"`: cambiaría cómo mueren las
# tareas de tokio. `escritorio/` e `instalador/` repiten el perfil.
lto = true
codegen-units = 1
strip = true
