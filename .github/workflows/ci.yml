name: CI

on:
  push:
    branches: [multisistema, desarrollo, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  plataforma:
    name: ea-plataforma (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ea-plataforma --all-targets --features tokio -- -D warnings
      - name: Pruebas
        run: cargo test -p ea-plataforma --features tokio

  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - name: Instalar bubblewrap (pruebas del sandbox real)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restringe los espacios de nombres sin privilegios.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Comprobar que sh existe
        shell: bash
        run: command -v sh && sh -c 'echo sh ok'
      # Compilación de todo el workspace, pruebas incluidas. Clippy con
      # -D warnings solo se exige a ea-plataforma (job anterior): el resto
      # del workspace arrastra avisos antiguos ajenos a esta spec.
      - name: Compilar
        run: cargo build --workspace --all-targets --keep-going
      - name: Pruebas
        run: cargo test --workspace --no-fail-fast

  escritorio:
    name: escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio
          key: escritorio
      - name: Instalar dependencias de WebKitGTK y bandeja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Compilar
        run: cargo build --manifest-path escritorio/Cargo.toml
      - name: Pruebas
        run: cargo test --manifest-path escritorio/Cargo.toml

  instalador:
    name: instalador y scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: instalador
          key: instalador
      - name: Pruebas del instalador
        run: cargo test --manifest-path instalador/Cargo.toml
      - name: Compilar con binarios de prueba
        shell: bash
        run: |
          mkdir -p binarios-prueba
          for b in ea ea-web ea-mcp ea-orchestrator ea-escritorio; do : > "binarios-prueba/$b.exe"; done
          GACHAPON_BINARIOS="$PWD/binarios-prueba" cargo build --manifest-path instalador/Cargo.toml
      - name: instalar.sh (sintaxis y shellcheck)
        if: runner.os == 'Linux'
        run: |
          sh -n instalar.sh
          if command -v shellcheck >/dev/null; then shellcheck instalar.sh; else echo "sin shellcheck"; fi
      - name: instalar.ps1 (sintaxis)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errores = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path instalar.ps1).Path, [ref]$null, [ref]$errores) | Out-Null
          if ($errores) { $errores | ForEach-Object { Write-Error $_.Message }; exit 1 }
