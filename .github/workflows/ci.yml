name: CI

on:
  push:
    branches: [multisistema, desarrollo, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  plataforma:
    name: ea-plataforma (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ea-plataforma --all-targets --features tokio -- -D warnings
      - name: Pruebas
        run: cargo test -p ea-plataforma --features tokio
