[package]
name = "ea-acciones"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Los dobles de prueba (`SistemaSimulado`, `TerminalSimulada`); solo los activan las
# `[dev-dependencies]`.
dobles = ["ea-biblioteca/dobles"]

[dependencies]
ea-store = { path = "../ea-store" }
ea-boveda = { path = "../ea-boveda" }
ea-bus = { path = "../ea-bus" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
ea-plataforma = { path = "../ea-plataforma" }
time = { workspace = true, features = ["formatting", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "rt"] }
# La sonda de los modelos de `salud` (un endpoint local puede ser `https://`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Las pruebas de `tests/` usan los dobles (`SistemaSimulado`, `TerminalSimulada`).
ea-acciones = { path = ".", features = ["dobles"] }
ea-pruebas = { path = "../ea-pruebas" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
