[package]
name = "ea-acciones"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ea-store = { path = "../ea-store" }
ea-boveda = { path = "../ea-boveda" }
ea-bus = { path = "../ea-bus" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
ea-plataforma = { path = "../ea-plataforma" }
time = { version = "0.3", features = ["formatting", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
tokio = { version = "1", features = ["process", "time", "rt"] }
# La sonda de los modelos de `salud` (un endpoint local puede ser `https://`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
