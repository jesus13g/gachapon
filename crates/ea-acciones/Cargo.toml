[package]
name = "ea-acciones"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ea-store = { path = "../ea-store" }
ea-boveda = { path = "../ea-boveda" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
