[package]
name = "ea-orchestrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ea-orchestrator"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-bus = { path = "../ea-bus" }
ea-ajustes = { path = "../ea-ajustes" }
ea-plataforma = { path = "../ea-plataforma", features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
anyhow.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
ea-pruebas = { path = "../ea-pruebas" }
time = { workspace = true, features = ["formatting", "parsing"] }
