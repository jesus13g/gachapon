[package]
name = "ea-orchestrator"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ea-orchestrator"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-bus = { path = "../ea-bus" }
ea-ajustes = { path = "../ea-ajustes" }
ea-plataforma = { path = "../ea-plataforma" }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
anyhow = "1.0"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
