[package]
name = "ea-bus"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ea-store = { path = "../ea-store" }
ea-ajustes = { path = "../ea-ajustes" }
ea-plataforma = { path = "../ea-plataforma" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"

[dev-dependencies]
ea-pruebas = { path = "../ea-pruebas" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
