[package]
name = "ea-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ea-web"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-bus = { path = "../ea-bus" }
ea-acciones = { path = "../ea-acciones" }
ea-boveda = { path = "../ea-boveda" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "process", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "macros"] }
anyhow.workspace = true
thiserror.workspace = true
ea-plataforma = { path = "../ea-plataforma", features = ["tokio"] }
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
# Las pruebas usan la terminal simulada.
ea-acciones = { path = "../ea-acciones", features = ["dobles"] }
ea-pruebas = { path = "../ea-pruebas" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile.workspace = true
