[package]
name = "ea-mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ea-mcp"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-acciones = { path = "../ea-acciones" }
ea-bus = { path = "../ea-bus" }
ea-boveda = { path = "../ea-boveda" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
ea-plataforma = { path = "../ea-plataforma", features = ["tokio"] }
rmcp = { version = "3.3", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
rmcp = { version = "3.3", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tempfile = "3"
