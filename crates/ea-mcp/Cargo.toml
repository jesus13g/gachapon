[package]
name = "ea-mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ea-mcp"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-acciones = { path = "../ea-acciones" }
ea-bus = { path = "../ea-bus" }
ea-boveda = { path = "../ea-boveda" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
ea-plataforma = { path = "../ea-plataforma", features = ["tokio"] }
rmcp = { workspace = true, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-util = "0.7"
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = "1.0"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
ea-pruebas = { path = "../ea-pruebas", features = ["mcp"] }
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tempfile.workspace = true
