[package]
name = "ea-plataforma"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Diferencias entre Linux, macOS y Windows concentradas en un solo crate"

[features]
# Habilita `parada` (espera de SIGTERM / Ctrl-C) y `preparar_grupo_tokio`.
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, features = ["signal", "process", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
