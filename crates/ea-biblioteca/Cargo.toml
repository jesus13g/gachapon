[package]
name = "ea-biblioteca"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Los dobles de prueba (`OrdenesDoble`); solo los activan las `[dev-dependencies]`.
dobles = []

[dependencies]
ea-ajustes = { path = "../ea-ajustes" }
ea-plataforma = { path = "../ea-plataforma" }
# El diario del ecosistema, en solo lectura (`Store::abrir_lectura`).
ea-store = { path = "../ea-store" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
# Solo lectura de las bases ajenas (OpenCode, Codex): no son del ecosistema y aquí no
# se debe escribir nada.
rusqlite = { workspace = true, features = ["bundled"] }
time = { workspace = true, features = ["formatting", "parsing"] }

[dev-dependencies]
# Las pruebas de `tests/` usan los dobles (`OrdenesDoble`).
ea-biblioteca = { path = ".", features = ["dobles"] }
ea-pruebas = { path = "../ea-pruebas" }
tempfile.workspace = true
