[package]
name = "ea-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ea"
path = "src/main.rs"

[dependencies]
ea-store = { path = "../ea-store" }
ea-acciones = { path = "../ea-acciones" }
ea-orchestrator = { path = "../ea-orchestrator" }
ea-web = { path = "../ea-web" }
tokio = { version = "1", features = ["rt", "time", "process"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
comfy-table = "7.1"
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
