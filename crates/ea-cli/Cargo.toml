[package]
name = "ea-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ea"
path = "src/main.rs"

[dependencies]
ea-plataforma = { path = "../ea-plataforma" }
ea-store = { path = "../ea-store" }
ea-bus = { path = "../ea-bus" }
ea-acciones = { path = "../ea-acciones" }
ea-boveda = { path = "../ea-boveda" }
ea-ajustes = { path = "../ea-ajustes" }
ea-biblioteca = { path = "../ea-biblioteca" }
ea-web = { path = "../ea-web" }
tokio = { version = "1", features = ["rt", "time", "process"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
comfy-table = "7.1"
# El instalador conserva el orden de las claves de settings.json al fusionar el hook.
serde_json = { version = "1.0", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
