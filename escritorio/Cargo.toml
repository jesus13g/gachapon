[package]
name = "ea-escritorio"
version = "0.1.0"
edition = "2024"
# Tauri 2 pide 1.90 (el workspace se queda en 1.89).
rust-version = "1.90"
publish = false
description = "Shell de escritorio (Tauri 2) del panel de ea-web; fuera del workspace principal (spec 021)"
build = "build.rs"

[[bin]]
name = "ea-escritorio"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
ea-ajustes = { path = "../crates/ea-ajustes" }
ea-plataforma = { path = "../crates/ea-plataforma" }
anyhow = "1"
serde_json = "1"
url = "2"
ureq = { version = "2", default-features = false, features = ["json"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Paquete propio: no pertenece al workspace principal.
[workspace]
